<link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9f0ee; --panel:#f8fbfa; --panel-2:#e3edeb; --board:#cddcd9; --line:#b0c8c4;
  --text:#10303a; --muted:#47696f; --accent:#d99a1e; --accent-ink:#2a1b00; --accent-text:#855600;
  --good:#23704a; --bad:#b53a22; --floor:#fbfdfc; --floor-line:#a6c0bd; --wall:#7f9fa1;
  --puddle:#3b8fb8; --crate:#c5822d; --crate-dark:#7d4a12; --code-bg:#edf4f2; --beam:rgba(217,154,30,.32);
  --bot:#2f5964; --bot-dark:#183840;
  --sea:#8fb9bd; --tower:#fdfefe; --rock:#5d8085; --lamp-off:#a7bcbe; --stars:0; --glow:rgba(217,154,30,.22);
  --serif:'Young Serif','Noto Serif',Georgia,'Times New Roman',serif;
  --mono:'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --code:'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f242b; --panel:#17343d; --panel-2:#1e4450; --board:#0a1a1f; --line:#2f5a66;
    --text:#e8f0ea; --muted:#9fbab6; --accent:#e8b042; --accent-ink:#271a00; --accent-text:#f0c15f;
    --good:#8fd0a4; --bad:#f5806a; --floor:#2a5560; --floor-line:#3a6b77; --wall:#16313a;
    --puddle:#4fa8cf; --crate:#c98a38; --crate-dark:#7e4d15; --code-bg:#0b1b20; --beam:rgba(232,176,66,.34);
    --bot:#d6e6e1; --bot-dark:#6f9a9b;
    --sea:#0b2a33; --tower:#dfeae6; --rock:#13303a; --lamp-off:#3b5a63; --stars:1; --glow:rgba(232,176,66,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#0f242b; --panel:#17343d; --panel-2:#1e4450; --board:#0a1a1f; --line:#2f5a66;
  --text:#e8f0ea; --muted:#9fbab6; --accent:#e8b042; --accent-ink:#271a00; --accent-text:#f0c15f;
  --good:#8fd0a4; --bad:#f5806a; --floor:#2a5560; --floor-line:#3a6b77; --wall:#16313a;
  --puddle:#4fa8cf; --crate:#c98a38; --crate-dark:#7e4d15; --code-bg:#0b1b20; --beam:rgba(232,176,66,.34);
  --bot:#d6e6e1; --bot-dark:#6f9a9b;
  --sea:#0b2a33; --tower:#dfeae6; --rock:#13303a; --lamp-off:#3b5a63; --stars:1; --glow:rgba(232,176,66,.12);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:14px; line-height:1.5; min-height:100vh; -webkit-tap-highlight-color:transparent; }
button,input,select{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.app{ max-width:1120px; margin:0 auto; padding:14px 16px 56px; position:relative; }

/* sky */
.sky{ position:fixed; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(120% 70% at 50% 112%, var(--glow), transparent 62%), var(--bg); }
.sky::before,.sky::after{ content:''; position:absolute; inset:0; opacity:var(--stars); background-repeat:repeat; animation:twinkle 5.5s ease-in-out infinite; }
.sky::before{ background-image:radial-gradient(1.6px 1.6px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 20px,#ffe9b0,transparent),radial-gradient(1px 1px at 60px 140px,#fff,transparent); background-size:200px 180px; }
.sky::after{ background-image:radial-gradient(1.2px 1.2px at 40px 60px,#fff,transparent),radial-gradient(1.8px 1.8px at 150px 110px,#ffe9b0,transparent),radial-gradient(1px 1px at 230px 30px,#fff,transparent); background-size:310px 260px; animation-delay:-2.7s; }
@keyframes twinkle{ 0%,100%{ opacity:calc(var(--stars) * .95); } 50%{ opacity:calc(var(--stars) * .35); } }

/* top bar */
.bar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:6px 0 16px; }
.lead{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.brand{ font-family:var(--serif); font-size:24px; background:none; border:0; color:var(--text); cursor:pointer; padding:4px 6px 4px 2px; }
.snd,.langsel{ font-size:12.5px; padding:5px 11px; border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:999px; cursor:pointer; }
.snd[aria-pressed="true"]{ color:var(--text); border-color:var(--accent); }
.langsel{ padding:5px 8px; color:var(--text); max-width:150px; }
.lamps{ display:flex; gap:6px; overflow-x:auto; max-width:100%; padding:3px; }
.lamp{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 13px 6px 11px; cursor:pointer; white-space:nowrap; }
.lamp::before{ content:''; width:10px; height:10px; border-radius:50%; background:var(--line); flex:none; }
.lamp.done::before{ background:var(--accent); box-shadow:0 0 0 3px var(--beam), 0 0 12px 3px var(--beam); }
.lamp.cur{ color:var(--text); border-color:var(--accent); }
.lamp:disabled{ opacity:.45; cursor:not-allowed; }
.lamp.pop::before{ animation:lamppop .9s ease; }
@keyframes lamppop{ 0%{ transform:scale(1); } 35%{ transform:scale(2.2); } 100%{ transform:scale(1); } }

/* layout */
.stage{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:24px; align-items:start; }
@media (max-width:880px){ .stage{ grid-template-columns:minmax(0,1fr); } }
.col{ display:flex; flex-direction:column; gap:14px; min-width:0; }

/* story */
.story{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px 16px; }
.storyhead{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.story h2{ font-family:var(--serif); font-weight:400; font-size:26px; line-height:1.2; margin:0 0 12px; }
.line{ font-family:var(--serif); font-size:16.5px; line-height:1.65; margin:0 0 10px; max-width:62ch; }
.line.narr{ color:var(--muted); }
.line.says{ padding-inline-start:12px; border-inline-start:3px solid var(--accent); }
.who{ font-family:var(--mono); font-size:12.5px; color:var(--accent-text); margin-inline-end:8px; }
.task{ font-size:13.5px; margin:12px 0 0; padding:10px 12px; background:var(--panel-2); border-radius:8px; max-width:70ch; }
.talking,.line.narr.talking{ background:var(--beam); box-shadow:0 0 0 6px var(--beam); border-radius:4px; color:var(--text); }

/* board */
.boardwrap{ display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
.hud{ display:flex; gap:8px; }
.chip{ display:inline-block; padding:4px 12px; border:1px solid var(--accent); border-radius:999px; background:var(--panel); font-weight:500; direction:ltr; unicode-bidi:isolate; }
.chip b{ font-weight:600; }
.chip.pop{ animation:chip .45s ease; }
@keyframes chip{ 0%{ transform:scale(1); } 40%{ transform:scale(1.22); background:var(--beam); } 100%{ transform:scale(1); } }
.board{ direction:ltr; width:min(100%, calc(var(--cols) * 64px + 16px)); background:var(--board); border:1px solid var(--line); border-radius:14px; padding:8px; }
.board.win{ animation:boardglow 1.3s ease-out; }
@keyframes boardglow{ 0%{ box-shadow:0 0 0 0 var(--beam); } 35%{ box-shadow:0 0 44px 12px var(--beam); } 100%{ box-shadow:0 0 0 0 transparent; } }
.field{ position:relative; width:100%; aspect-ratio:var(--cols) / var(--rows); }
.tiles{ position:absolute; inset:0; display:grid; grid-template-columns:repeat(var(--cols),1fr); grid-template-rows:repeat(var(--rows),1fr); }
.t{ position:relative; display:flex; align-items:center; justify-content:center; min-width:0; min-height:0; }
.t svg{ width:78%; height:78%; }
.t.floor,.t.wall{ animation:tilein .45s ease-out both; animation-delay:calc(var(--i) * 24ms); }
@keyframes tilein{ from{ opacity:0; transform:scale(.55); } }
.t.floor{ background:var(--floor); box-shadow:inset 0 0 0 1px var(--floor-line); }
.t.wall{ background:var(--wall); box-shadow:inset 0 0 0 1px rgba(0,0,0,.14); }
.t.goal{ color:var(--accent-text); }
.t.goal:not(.lit) svg{ animation:pulse 2.2s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(1); filter:drop-shadow(0 0 0 transparent); } 50%{ transform:scale(1.1); filter:drop-shadow(0 0 6px var(--accent)); } }
.t.goal.lit{ background:var(--beam); }
.t.goal.lit svg{ filter:drop-shadow(0 0 7px var(--accent)); }
.t.puddle svg{ animation:ripple 3.2s ease-in-out infinite; }
@keyframes ripple{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06,.96); } }
.t.hit{ outline:3px solid var(--bad); outline-offset:-3px; z-index:2; }
.t.trail::after{ content:''; position:absolute; width:26%; height:26%; border-radius:50%; background:var(--accent); opacity:.34; animation:dot .4s ease-out; }
@keyframes dot{ from{ transform:scale(0); opacity:.9; } to{ transform:scale(1); opacity:.34; } }
.wick{ position:absolute; width:calc(100% / var(--cols)); height:calc(100% / var(--rows)); left:calc(var(--x) * 100% / var(--cols)); top:calc(var(--y) * 100% / var(--rows)); transition:left var(--dur,.28s) ease, top var(--dur,.28s) ease; pointer-events:none; z-index:3; display:flex; align-items:center; justify-content:center; }
.wick .rot{ width:86%; height:86%; transform:rotate(var(--rot)); transition:transform var(--dur,.28s) ease; }
.wick svg{ width:100%; height:100%; overflow:visible; animation:idle 2.8s ease-in-out infinite; }
@keyframes idle{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.045); } }
.wick.snap,.wick.snap .rot{ transition:none; }
@keyframes bump{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
.wick.bump{ animation:bump .3s ease 2; }
.wick.zap svg{ filter:drop-shadow(0 0 6px var(--bad)); }
@keyframes cheer{ 0%,100%{ transform:translateY(0); } 40%{ transform:translateY(-22%); } }
.wick.cheer{ animation:cheer .55s ease 3; }
.beamp{ transform-origin:20px 11px; }
.wick.go .beamp{ animation:flick 1.6s ease-in-out infinite; }
@keyframes flick{ 0%,100%{ opacity:1; } 45%{ opacity:.55; } 60%{ opacity:.9; } }
.fx{ position:absolute; left:calc((var(--x) + .5) * 100% / var(--cols)); top:calc((var(--y) + .5) * 100% / var(--rows)); width:0; height:0; pointer-events:none; z-index:5; }
.fx i{ position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--c); opacity:0; animation:fly var(--t,.8s) cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes fly{ 0%{ opacity:1; transform:translate(0,0) scale(1); } 100%{ opacity:0; transform:translate(var(--dx),var(--dy)) scale(.2); } }
.bubble{ position:absolute; z-index:6; left:calc((var(--x) + .5) * 100% / var(--cols)); top:calc(var(--y) * 100% / var(--rows)); transform:translate(-50%,-100%); background:var(--panel); color:var(--text); border:1px solid var(--accent); border-radius:8px; padding:2px 9px; font-size:12px; white-space:nowrap; pointer-events:none; animation:bubble 1.3s ease forwards; }
.bubble.yes{ border-color:var(--good); color:var(--good); }
@keyframes bubble{ 0%{ opacity:0; margin-top:6px; } 15%{ opacity:1; margin-top:0; } 80%{ opacity:1; } 100%{ opacity:0; margin-top:-6px; } }

/* controls */
.controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.btn{ font-size:13.5px; padding:9px 15px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); border-radius:8px; cursor:pointer; text-decoration:none; display:inline-block; transition:transform .08s ease; }
.btn:hover:not(:disabled){ border-color:var(--accent); }
.btn:active:not(:disabled){ transform:translateY(1px) scale(.98); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
.btn.primary.ready{ animation:ready 1.9s ease-in-out infinite; }
@keyframes ready{ 0%,100%{ box-shadow:0 0 0 0 var(--beam); } 50%{ box-shadow:0 0 0 8px transparent, 0 0 18px 3px var(--beam); } }
.btn.big{ padding:12px 20px; font-size:15px; }
.btn.ghost{ background:transparent; }
.btn.small{ padding:4px 10px; font-size:12.5px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.speed{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; margin-inline-start:auto; }
.speed select{ font-size:inherit; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 6px; }
.status{ min-height:1.5em; margin:0; color:var(--muted); font-size:13.5px; }
.status.bad{ color:var(--bad); font-weight:500; }
.status.good{ color:var(--good); font-weight:500; }
.hint p{ margin:0 0 6px; padding:8px 12px; background:var(--panel-2); border-radius:8px; max-width:70ch; }

/* result */
.result{ border:1px solid var(--good); border-inline-start-width:5px; border-radius:12px; background:var(--panel); padding:16px 18px; animation:rise .45s ease; }
@keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
.result h3{ font-family:var(--serif); font-weight:400; font-size:21px; margin:0 0 8px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.result h4{ font-family:var(--serif); font-weight:400; font-size:17px; margin:14px 0 4px; }
.result p{ margin:0 0 8px; max-width:66ch; }
.result .say{ font-family:var(--serif); font-size:16.5px; line-height:1.6; padding-inline-start:12px; border-inline-start:3px solid var(--accent); }
.result .meta{ color:var(--muted); font-size:13px; }
.badge{ font-family:var(--mono); font-size:12px; padding:3px 10px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-weight:600; position:relative; overflow:hidden; }
.badge::after{ content:''; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%); transform:translateX(-120%); animation:shine 2.6s ease-in-out infinite; }
@keyframes shine{ 0%{ transform:translateX(-120%); } 55%,100%{ transform:translateX(120%); } }
.scorebox{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:12px 0 4px; }
.scorebox .big{ font-family:var(--serif); font-size:46px; line-height:1; color:var(--accent-text); direction:ltr; unicode-bidi:isolate; min-width:3ch; }
.scorebox .lbl{ color:var(--muted); }

/* right column */
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
.phead{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.panel h3{ font-family:var(--serif); font-weight:400; font-size:18px; margin:0; }
.count{ color:var(--muted); font-size:12.5px; }
.cap{ color:var(--muted); font-size:12.5px; margin:0 0 8px; max-width:60ch; }
.cmds{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.cmd{ text-align:start; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--text); cursor:pointer; transition:transform .08s ease; }
.cmd:hover:not(:disabled){ border-color:var(--accent); }
.cmd:active:not(:disabled){ transform:scale(.97); }
.cmd:disabled{ opacity:.45; cursor:not-allowed; }
.cmd.nudge{ border-color:var(--accent); animation:ready 1.6s ease-in-out infinite; }
.cmd b{ display:block; font-weight:600; font-size:13.5px; }
.cmd span{ display:block; color:var(--muted); font-size:12px; }
.cmd .new{ display:inline; color:var(--accent-text); font-size:11.5px; margin-inline-start:6px; font-weight:600; font-style:normal; }
.list{ display:flex; flex-direction:column; }
.slot{ display:block; width:100%; background:none; border:0; padding:0; height:8px; cursor:pointer; border-radius:4px; font-size:12px; color:var(--muted); text-align:start; }
.slot:hover{ background:var(--beam); }
.slot.active{ height:auto; min-height:26px; padding:4px 8px; border:1px dashed var(--accent); color:var(--accent-text); background:transparent; }
.slot.empty{ height:auto; min-height:30px; padding:6px 8px; border:1px dashed var(--line); }
.slot.empty.active{ border-color:var(--accent); }
.node{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
.node .lbl{ font-weight:600; }
.node .rm{ margin-inline-start:auto; background:transparent; border:0; color:var(--muted); cursor:pointer; padding:2px 6px; border-radius:6px; font-size:13px; }
.node .rm:hover{ color:var(--bad); }
.node.block{ display:block; padding:0; }
.bh{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 10px; }
.bbody{ margin-block:0 8px; margin-inline:14px 8px; padding-inline-start:10px; border-inline-start:3px solid var(--accent); }
.elsehead{ padding:4px 10px 2px; font-weight:600; }
.node.in{ border-color:var(--accent); }
.node.cur{ box-shadow:0 0 0 2px var(--accent); background:var(--beam); }
.node.err{ box-shadow:0 0 0 2px var(--bad); }
.stepper{ display:inline-flex; align-items:center; gap:3px; direction:ltr; }
.stepper button{ width:24px; height:24px; border:1px solid var(--line); background:var(--panel); border-radius:6px; cursor:pointer; color:var(--text); line-height:1; }
.stepper button:hover{ border-color:var(--accent); }
.stepper output{ min-width:22px; text-align:center; font-weight:600; }
.routine{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
.code{ direction:ltr; text-align:left; background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:8px 0; overflow-x:auto; font-family:var(--code); font-size:13px; }
.cl{ white-space:pre; padding:1px 12px; min-height:1.5em; }
.cl.in{ background:rgba(127,127,127,.14); }
.cl.cur{ background:var(--beam); }
.cl.err{ background:rgba(200,60,40,.2); }
.cl.cm{ color:var(--muted); }

/* title and ending */
.title,.end{ max-width:680px; margin:2vh auto 0; }
.hero{ width:100%; margin:0 auto; }
.hero svg{ width:100%; height:auto; display:block; border-radius:16px; }
.title h1,.end h2{ font-family:var(--serif); font-weight:400; font-size:clamp(34px,7.5vw,54px); line-height:1.1; margin:22px 0 8px; }
.tagline{ font-family:var(--serif); font-size:clamp(18px,3.4vw,22px); color:var(--accent-text); margin:0 0 20px; }
.title p,.end p{ font-family:var(--serif); font-size:17.5px; line-height:1.7; max-width:60ch; margin:0 0 14px; }
.title p.tagline{ font-size:clamp(18px,3.4vw,22px); }
.end p.line.says{ margin-top:6px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; align-items:center; }
.langs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:26px; }
.langs button{ font-size:13px; padding:5px 12px; border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:999px; cursor:pointer; }
.langs button[aria-pressed="true"]{ color:var(--text); border-color:var(--accent); background:var(--panel-2); }
.custom{ margin-top:24px; padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:14px; display:grid; gap:14px; }
.custom h3{ font-family:var(--serif); font-weight:400; font-size:18px; margin:0; }
.field-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.field-row label{ min-width:92px; color:var(--muted); }
.custom input[type=text]{ font-size:14px; padding:7px 10px; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:8px; width:min(100%,220px); }
.swatches{ display:flex; gap:8px; }
.swatches button{ width:30px; height:30px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0; }
.swatches button[aria-pressed="true"]{ border-color:var(--accent); box-shadow:0 0 0 3px var(--beam); }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
.seg button{ font-size:12.5px; padding:6px 13px; border:0; background:transparent; color:var(--muted); cursor:pointer; }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); font-weight:600; }
.concepts{ margin:22px 0 0; padding:0; list-style:none; }
.concepts li{ padding:14px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:6px 18px; }
.concepts h3{ font-family:var(--serif); font-weight:400; font-size:19px; margin:0 0 2px; }
.concepts p{ font-family:var(--mono); font-size:13px; margin:0; color:var(--muted); max-width:none; }
.concepts pre{ direction:ltr; text-align:left; margin:0; padding:8px 12px; background:var(--code-bg); border:1px solid var(--line); border-radius:8px; font-family:var(--code); font-size:12.5px; overflow-x:auto; }
@media (max-width:620px){ .concepts li{ grid-template-columns:minmax(0,1fr); } }
.endscore{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin:18px 0 0; }
.endscore .big{ font-family:var(--serif); font-size:64px; line-height:1; color:var(--accent-text); direction:ltr; unicode-bidi:isolate; }
.endscore span{ color:var(--muted); }

/* hero scene */
.hero .st{ fill:#fff; opacity:var(--stars); animation:twinkle 4s ease-in-out infinite; }
.hero .wv1{ animation:wave 16s linear infinite; }
.hero .wv2{ animation:wave 10s linear infinite reverse; }
@keyframes wave{ to{ transform:translateX(-640px); } }
.hero .beams{ transform-origin:320px 69px; animation:sway 7s ease-in-out infinite alternate; }
@keyframes sway{ from{ transform:rotate(-5deg); } to{ transform:rotate(5deg); } }
.hero .lampoff{ animation:lampflick 3.6s steps(1) infinite; }
@keyframes lampflick{ 0%{ opacity:1; } 8%{ opacity:.35; } 10%{ opacity:1; } 60%{ opacity:1; } 62%{ opacity:.5; } 64%{ opacity:1; } }
.hero .bob{ animation:bob 3.4s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-1.5deg); } 50%{ transform:translateY(3px) rotate(1.5deg); } }
.hero .arrive{ animation:arrive 10s cubic-bezier(.2,.6,.3,1) forwards; }
@keyframes arrive{ from{ transform:translateX(250px); } to{ transform:translateX(0); } }

/* overlays */
.confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50; }
.confetti i{ position:absolute; top:-20px; background:var(--c); border-radius:2px; animation:conf 2.6s var(--d) cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes conf{ to{ transform:translate(var(--x),108vh) rotate(var(--r)); } }
.sweep{ position:fixed; inset:0; pointer-events:none; z-index:40; background:linear-gradient(105deg,transparent 34%,var(--beam) 50%,transparent 66%); transform:translateX(-110%); animation:sweepx 1.2s ease-out forwards; }
@keyframes sweepx{ to{ transform:translateX(110%); } }
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--panel); color:var(--text); border:1px solid var(--accent); border-radius:999px; padding:9px 18px; z-index:80; font-size:13.5px; max-width:90vw; animation:rise .3s ease; }
.modal{ position:fixed; inset:0; z-index:70; background:rgba(5,15,18,.78); display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto; }
.mbox{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; width:min(100%,460px); max-height:100%; overflow:auto; }
.mbox img{ width:100%; height:auto; border-radius:10px; display:block; background:var(--board); aspect-ratio:4/5; }
.mbox .cap{ margin:10px 0 0; }
.mbox .row{ margin-top:12px; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; animation-delay:0s !important; }
}
:root{ --sky1:#a9d3da; --sky2:#f6e7c1; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky1:#06161b; --sky2:#14424e; } }
:root[data-theme="dark"]{ --sky1:#06161b; --sky2:#14424e; }
.end p.cap{ font-family:var(--mono); font-size:13px; color:var(--muted); margin:6px 0 0; }
.title .row .snd, .end .row .snd{ font-size:13px; padding:7px 14px; }
body{ overscroll-behavior-y:none; }
button,.btn,.cmd,.slot,.lamp,select{ touch-action:manipulation; }
.toast{ border-radius:14px; text-align:center; white-space:normal; line-height:1.4; }
.lb{ max-width:640px; margin:2vh auto 0; }
.lb h2{ font-family:var(--serif); font-weight:400; font-size:clamp(30px,6vw,44px); margin:16px 0 14px; }
.lb h3{ font-family:var(--serif); font-weight:400; font-size:19px; margin:22px 0 8px; }
.lb .cap{ color:var(--muted); font-size:13px; margin:0 0 10px; }
.seg.tabs{ display:flex; flex-wrap:wrap; border-radius:14px; }
.lbl{ list-style:none; margin:0; padding:0; }
.lbl li{ display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); }
.lbl li.me{ background:var(--beam); border-radius:8px; border-bottom-color:transparent; }
.lbl .rk{ font-family:var(--serif); font-size:20px; color:var(--accent-text); }
.lbl li:nth-child(-n+3) .rk{ font-size:24px; }
.lbl .nm{ overflow-wrap:anywhere; }
.lbl .nm em{ font-style:normal; font-size:12px; color:var(--muted); margin-inline-start:8px; }
.lbl .sc{ font-family:var(--serif); font-size:20px; direction:ltr; unicode-bidi:isolate; }
.chk{ display:flex; gap:10px; align-items:center; cursor:pointer; }
.chk input{ width:20px; height:20px; accent-color:var(--accent); }

c1_name:'الممر',c1_title:'الممر',
c1_i1:'تشويش، ثم نقرة. وعلى الطرف الآخر من جهاز اللاسلكي، يومض مصباح صغير في الظلام.',
c1_i2:'أيها المشغّل؟ أسمعك. أحذّرك: أنا روبوت حرفيّ جدًا. أفعل بالضبط ما تقوله لي، بالترتيب الذي تقوله.',
c1_i3:'مفتاح الكهرباء في نهاية الممر. هل تستطيع أن ترشدني إليه؟',
c1_task:'اختر أوامر من القائمة على اليسار ثم اضغط تشغيل. كل «تقدّم» يحرّك Wick مربعًا واحدًا في الاتجاه الذي ينظر إليه. الحلقة التي بداخلها برق هي المفتاح.',
c1_h1:'يبدأ Wick وهو ينظر إلى اليمين. المفتاح على بعد ثلاثة مربعات إلى اليمين ثم مربعين إلى الأسفل.',
c1_h2:'تقدّم، تقدّم، تقدّم، انعطف يمينًا، تقدّم، تقدّم.',
c1_win:'تم تشغيل المفتاح! أضاء أول مصباح. كل ما فعلته جاء من قائمتك، وبترتيبك.',
c1_text:'البرنامج قائمة من التعليمات تُنفَّذ واحدة تلو الأخرى، من الأعلى إلى الأسفل. لا يستطيع الحاسوب تخمين ما قصدته، لذا تهمّ الخطوات الدقيقة وترتيبها.',
c2_name:'الدَّرَج',c2_title:'الدَّرَج',
c2_i1:'الدَّرَج المؤدي إلى غرفة المصباح متعرّج: خطوة هنا، وخطوة هناك، مرة بعد مرة.',
c2_i2:'يمكنني صعوده أمرًا بعد أمر، لكن هذا يعني عشرين أمرًا. هل من طريقة لأقول «افعل هذا مرة أخرى»؟',
c2_task:'فكرة جديدة: الحلقات. اكتشف النمط، وأضف كتلة تكرار، وحدّد عدد مرات تشغيلها. الأوامر التي تضيفها بعد كتلة التكرار تدخل بداخلها.',
c2_h1:'الحركات الأربع الأولى هي: تقدّم، انعطف يمينًا، تقدّم، انعطف يسارًا. ثم تتكرر الحركات الأربع نفسها.',
c2_h2:'ضع هذه الأوامر الأربعة داخل كتلة تكرار واحدة واجعلها 5.',
c2_win:'خمس درجات بفكرة واحدة. أنت فكّرت، وكتلة التكرار تولّت العدّ.',
c2_text:'الحلقة تكرّر مجموعة من التعليمات حتى لا تضطر إلى كتابة الشيء نفسه مرارًا. أنت تختار ما يُكرَّر وكم مرة.',
c3_name:'القبو',c3_title:'القبو الغارق',
c3_i1:'بعد الدَّرَج يوجد ممر القبو. تسرّب إليه الماء واستقر في بقع على الأرض.',
c3_i2:'البرك ودوائري الكهربائية لا تتفقان. لا أستشعر إلا المربع الذي أمامي مباشرة، وأستطيع القفز فوق بركة إن رأيتها.',
c3_i3:'لا أرى كل البرك من هنا. هل يمكنني أن أقرر وأنا أتقدم؟',
c3_task:'فكرتان جديدتان: «إذا» و«كرّر حتى». كتلة «إذا» تفحص شيئًا، ثم تنفّذ إحدى مجموعتين من الأوامر. أما «كرّر حتى» فتستمر إلى أن يصل Wick إلى المفتاح.',
c3_h1:'قبل كل حركة، ينبغي لـ Wick أن ينظر ما أمامه. وهذا الفحص يجب أن يتكرر مرة بعد مرة، لذا يوضع داخل حلقة.',
c3_h2:'كرّر حتى المفتاح: إذا كانت هناك بركة أمامه فاقفز، وإلا فتقدّم.',
c3_win:'جافٌّ طوال الطريق! لم أحتج قط إلى معرفة أماكن البرك. اكتفيت بأن أنظر ثم أقرر.',
c3_text:'كتلة «إذا» تنفّذ مجموعة من التعليمات حين يكون السؤال صحيحًا، ومجموعة أخرى (جزء «وإلا») حين لا يكون. ومع الحلقة، يستطيع البرنامج التعامل مع أمور لم يتوقعها.',
c4_name:'الدرجات',c4_title:'البسطات',
c4_i1:'فوق القبو، ينفتح الدَّرَج على بسطات. كل بسطة أطول من التي قبلها بمربع واحد.',
c4_i2:'مربع واحد، ثم اثنان، ثم ثلاثة، ثم أربعة. كتلة تكرار عادية ستعطيني الطول نفسه في كل دورة، وهذا خطأ.',
c4_i3:'أحتاج إلى رقم يمكنني تغييره وأنا أتقدم. هل تعطيني مكانًا أحتفظ به فيه؟',
c4_task:'فكرة جديدة: المتغيّرات. المتغيّر صندوق له اسم يحمل قيمة. عيّن n إلى 1، وتقدّم n مربعًا، وأضف 1 إلى n في نهاية كل دورة.',
c4_h1:'الدورة الواحدة هي: تقدّم n، انعطف يمينًا، تقدّم، انعطف يسارًا، ثم اجعل n أكبر. هناك أربع دورات.',
c4_h2:'عيّن n إلى 1. ثم كرّر 4 مرات: تقدّم n، انعطف يمينًا، تقدّم، انعطف يسارًا، أضف 1 إلى n.',
c4_win:'أربع بسطات، كل واحدة أطول بمربع، وحلقة واحدة تعاملت معها جميعًا.',
c4_text:'المتغيّر اسم يحمل قيمة، ويمكن أن تتغير القيمة أثناء عمل البرنامج. هنا يبدأ n من 1 ويزداد بواحد في كل دورة، فتسير الحلقة نفسها على بسطة أطول في كل مرة.',
c5_name:'المخزن',c5_title:'المخزن',
c5_i1:'آخر غرفة قبل المصباح هي المخزن. تتكدّس الصناديق عبر الممر، وبجوار كل صندوق مسار جانبي ضيق.',
c5_i2:'في كل مرة الأمر نفسه: خطوة إلى الجانب، ثم أمرّ، ثم أعود خطوة. ثماني حركات، وثلاثة صناديق. لا أريد أن أسمعها أربعًا وعشرين مرة.',
c5_i3:'هل يمكنني أن أتعلّم الالتفاف مرة واحدة وأعطيه اسمًا؟',
c5_task:'فكرة جديدة: الدوال. ابنِ الالتفاف في مربع الروتين، ثم استخدم «استدعِ الالتفاف» أينما احتاج إليه Wick. غيّر الروتين فتتغيّر كل الاستدعاءات معه.',
c5_h1:'الالتفاف هو: انعطف يسارًا، تقدّم، انعطف يمينًا، تقدّم، تقدّم، انعطف يمينًا، تقدّم، انعطف يسارًا. ابنِه مرة واحدة في مربع الروتين.',
c5_h2:'الصناديق تفصل بينها أربعة مربعات. جرّب كرّر 3 مرات: تقدّم، تقدّم، استدعِ الالتفاف. ثم تقدّم مرة أخيرة. أو دع كتلة «إذا» تكتشف الصناديق.',
c5_win:'غرفة المصباح، ها أنا قادم! ثماني حركات، كُتبت مرة واحدة واستُخدمت ثلاث مرات.',
c5_text:'الدالة مجموعة تعليمات لها اسم، تكتبها مرة واحدة وتستخدمها متى احتجت إليها. تُبقي البرامج قصيرة، وإصلاحها في مكان واحد يصلح كل الاستدعاءات.',

c1_task:'Choisis des commandes dans la liste de droite, puis appuie sur Lancer. Chaque « avancer » déplace Wick d’une case dans la direction où il regarde. L’anneau avec l’éclair, c’est l’interrupteur.',
c1_h1:'Wick regarde vers la droite au départ. L’interrupteur est à trois cases à droite, puis deux cases plus bas.',
c1_h2:'avancer, avancer, avancer, tourner à droite, avancer, avancer.',
c1_win:'L’interrupteur est enclenché ! La première lampe est allumée. Tout ce que j’ai fait venait de ta liste, dans ton ordre.',
c1_text:'Un programme est une liste d’instructions exécutées une à la fois, de haut en bas. L’ordinateur ne devine pas ce que tu voulais dire : les étapes exactes et leur ordre comptent.',
c2_name:'Escalier',c2_title:'L’escalier',
c2_i1:'L’escalier vers la salle de la lanterne fait des zigzags : un pas par ici, un pas par là, encore et encore.',
c2_i2:'Je pourrais le monter commande par commande, mais ça ferait vingt commandes. Il n’y a pas un moyen de dire « refais ça » ?',
c2_task:'Nouvelle idée : les boucles. Repère le motif, ajoute un bloc répéter et règle le nombre de fois. Les commandes ajoutées après un bloc répéter se placent à l’intérieur.',
c2_h1:'Les quatre premiers mouvements sont : avancer, tourner à droite, avancer, tourner à gauche. Ensuite, les mêmes quatre reviennent.',
c2_h2:'Mets ces quatre commandes dans un seul bloc répéter réglé sur 5.',
c2_win:'Cinq marches avec une seule idée. Tu as réfléchi, et le bloc répéter a compté.',
c2_text:'Une boucle répète un groupe d’instructions pour ne pas avoir à écrire la même chose encore et encore. Tu choisis quoi répéter et combien de fois.',
c3_name:'Caveau',c3_title:'Le caveau inondé',
c3_i1:'Après l’escalier, il y a le couloir du caveau. L’eau s’est infiltrée et s’est installée en flaques sur le sol.',
c3_i2:'Les flaques et mes circuits ne font pas bon ménage. Je ne détecte que la case juste devant moi, et je peux sauter par-dessus une flaque si je la vois.',
c3_i3:'Je ne vois pas toutes les flaques d’ici. Je peux décider au fur et à mesure ?',
c3_task:'Nouvelles idées : « si » et « répéter jusqu’à ». Un bloc « si » vérifie quelque chose, puis exécute l’un ou l’autre groupe de commandes. « Répéter jusqu’à » continue jusqu’à ce que Wick atteigne l’interrupteur.',
c3_h1:'Avant chaque pas, Wick doit regarder ce qu’il y a devant. Ce test doit se répéter, donc il va dans une boucle.',
c3_h2:'répéter jusqu’à l’interrupteur : si flaque devant, sauter. Sinon, avancer.',
c3_win:'Au sec jusqu’au bout ! Je n’ai jamais eu besoin de savoir où étaient les flaques. J’ai regardé, puis j’ai décidé.',
c3_text:'Un bloc « si » exécute un groupe d’instructions quand une question est vraie et un autre (le « sinon ») quand elle ne l’est pas. Avec une boucle, un programme peut gérer ce qu’il n’avait pas prévu.',
c4_name:'Paliers',c4_title:'Les paliers',
c4_i1:'Au-dessus du caveau, l’escalier débouche sur des paliers. Chaque palier est une case plus long que le précédent.',
c4_i2:'Une case, puis deux, puis trois, puis quatre. Un simple bloc répéter me ferait faire la même longueur à chaque tour, et ce serait faux.',
c4_i3:'Il me faut un nombre que je puisse changer en route. Tu peux me donner un endroit où le garder ?',
c4_task:'Nouvelle idée : les variables. Une variable est une boîte nommée qui contient une valeur. Fixe n à 1, avance de n cases, puis ajoute 1 à n à la fin de chaque tour.',
c4_h1:'Un tour, c’est : avancer de n, tourner à droite, avancer, tourner à gauche, puis agrandir n. Il y a quatre tours.',
c4_h2:'fixer n à 1. Puis répéter 4 fois : avancer de n, tourner à droite, avancer, tourner à gauche, ajouter 1 à n.',
c4_win:'Quatre paliers, chacun une case plus long, et une seule boucle les a tous gérés.',
c4_text:'Une variable est un nom qui contient une valeur, et cette valeur peut changer pendant l’exécution. Ici, n commence à 1 et grandit de un à chaque tour : la même boucle parcourt donc un palier plus long à chaque fois.',
c5_name:'Réserve',c5_title:'La réserve',
c5_i1:'La dernière salle avant la lanterne est la réserve. Des caisses bloquent le couloir, avec une étroite voie latérale à côté de chacune.',
c5_i2:'À chaque fois, c’est pareil : un pas de côté, je passe, je reviens. Huit mouvements, trois caisses. Je préfère ne pas me les entendre dire vingt-quatre fois.',
c5_i3:'Je pourrais apprendre le détour une fois et lui donner un nom ?',
c5_task:'Nouvelle idée : les fonctions. Construis le détour dans la zone Routine, puis utilise appeler détour partout où Wick en a besoin. Change la routine et chaque appel change avec elle.',
c5_h1:'Le détour : tourner à gauche, avancer, tourner à droite, avancer, avancer, tourner à droite, avancer, tourner à gauche. Construis-le une fois dans la zone Routine.',
c5_h2:'Les caisses sont espacées de quatre cases. Essaie répéter 3 fois : avancer, avancer, appeler détour. Puis un dernier avancer. Ou laisse un bloc « si » repérer les caisses.',
c5_win:'Salle de la lanterne, me voilà ! Huit mouvements, écrits une fois et utilisés trois fois.',
c5_text:'Une fonction est un groupe d’instructions nommé que tu écris une fois et utilises quand tu en as besoin. Elle raccourcit les programmes, et la corriger à un endroit corrige tous les appels.',

c1_name:'Pasillo',c1_title:'El pasillo',
c1_i1:'Estática y luego un clic. Al otro lado de la radio, una pequeña lámpara se enciende en la oscuridad.',
c1_i2:'¿Operador? Te oigo. Te aviso: soy un robot muy literal. Hago exactamente lo que me dices, en el orden en que me lo dices.',
c1_i3:'El interruptor de la corriente está al final del pasillo. ¿Puedes guiarme hasta allí?',
c1_task:'Elige comandos de la lista de la derecha y pulsa Ejecutar. Cada «avanzar» mueve a Wick una casilla hacia donde mira. El anillo con el rayo es el interruptor.',
c1_h1:'Wick empieza mirando a la derecha. El interruptor está tres casillas a la derecha y luego dos hacia abajo.',
c1_h2:'avanzar, avanzar, avanzar, girar a la derecha, avanzar, avanzar.',
c1_win:'¡El interruptor está activado! La primera lámpara se ha encendido. Todo lo que hice salió de tu lista, en tu orden.',
c1_text:'Un programa es una lista de instrucciones que se ejecutan una a una, de arriba abajo. El ordenador no adivina lo que querías decir, así que importan los pasos exactos y su orden.',
c2_name:'Escaleras',c2_title:'Las escaleras',
c2_i1:'Las escaleras a la sala de la linterna van en zigzag: un paso para aquí, un paso para allá, una y otra vez.',
c2_i2:'Podría subirlas comando a comando, pero serían veinte comandos. ¿Hay forma de decir «haz esto otra vez»?',
c2_task:'Idea nueva: los bucles. Descubre el patrón, añade un bloque repetir y fija cuántas veces se ejecuta. Los comandos que añadas después de un repetir van dentro.',
c2_h1:'Los cuatro primeros movimientos son avanzar, girar a la derecha, avanzar, girar a la izquierda. Luego se repiten los mismos cuatro.',
c2_h2:'Mete esos cuatro comandos en un solo bloque repetir fijado en 5.',
c2_win:'Cinco escalones con una sola idea. Tú pensaste y el bloque repetir contó.',
c2_text:'Un bucle repite un grupo de instrucciones para no tener que escribir lo mismo una y otra vez. Tú eliges qué repetir y cuántas veces.',
c3_name:'Bóveda',c3_title:'La bóveda inundada',
c3_i1:'Pasadas las escaleras está el corredor de la bóveda. El agua se ha filtrado y ha formado charcos por el suelo.',
c3_i2:'Los charcos y mis circuitos no se llevan bien. Solo percibo la casilla que tengo justo delante, y puedo saltar un charco si lo veo.',
c3_i3:'No veo todos los charcos desde aquí. ¿Puedo decidir sobre la marcha?',
c3_task:'Ideas nuevas: «si» y «repetir hasta». Un bloque «si» comprueba algo y ejecuta un grupo de comandos u otro. «Repetir hasta» sigue hasta que Wick llegue al interruptor.',
c3_h1:'Antes de cada movimiento, Wick debe mirar qué hay delante. Esa comprobación se repite una y otra vez, así que va dentro de un bucle.',
c3_h2:'repetir hasta el interruptor: si hay charco delante, saltar. Si no, avanzar.',
c3_win:'¡Seco todo el camino! Nunca necesité saber dónde estaban los charcos. Solo miré y decidí.',
c3_text:'Un bloque «si» ejecuta un grupo de instrucciones cuando una pregunta es verdadera y otro (el «si no») cuando no lo es. Junto con un bucle, un programa puede enfrentarse a cosas que no esperaba.',
c4_name:'Rellanos',c4_title:'Los rellanos',
c4_i1:'Sobre la bóveda, las escaleras se abren en rellanos. Cada rellano es una casilla más largo que el anterior.',
c4_i2:'Una casilla, luego dos, luego tres, luego cuatro. Un simple bloque repetir me daría la misma longitud en cada vuelta, y eso está mal.',
c4_i3:'Necesito un número que pueda cambiar sobre la marcha. ¿Me das un sitio donde guardarlo?',
c4_task:'Idea nueva: las variables. Una variable es una caja con nombre que guarda un valor. Fija n en 1, avanza n casillas y suma 1 a n al final de cada vuelta.',
c4_h1:'Una vuelta es: avanzar n, girar a la derecha, avanzar, girar a la izquierda y luego hacer n más grande. Son cuatro vueltas.',
c4_h2:'fijar n en 1. Luego repetir 4 veces: avanzar n, girar a la derecha, avanzar, girar a la izquierda, sumar 1 a n.',
c4_win:'Cuatro rellanos, cada uno una casilla más largo, y un solo bucle los resolvió todos.',
c4_text:'Una variable es un nombre que guarda un valor, y ese valor puede cambiar mientras corre el programa. Aquí n empieza en 1 y crece uno por vuelta, así que el mismo bucle recorre un rellano más largo cada vez.',
c5_name:'Almacén',c5_title:'El almacén',
c5_i1:'La última sala antes de la linterna es el almacén. Hay cajas apiladas a lo ancho del pasillo, con un estrecho carril lateral junto a cada una.',
c5_i2:'Siempre es lo mismo: un paso al lado, avanzar, un paso de vuelta. Ocho movimientos, tres cajas. Prefiero no oírlos veinticuatro veces.',
c5_i3:'¿Podría aprender el desvío una vez y ponerle nombre?',
c5_task:'Idea nueva: las funciones. Construye el desvío en la caja de rutina y usa llamar desvío donde Wick lo necesite. Cambia la rutina y cada llamada cambia con ella.',
c5_h1:'El desvío es: girar a la izquierda, avanzar, girar a la derecha, avanzar, avanzar, girar a la derecha, avanzar, girar a la izquierda. Constrúyelo una vez en la caja de rutina.',
c5_h2:'Las cajas están a cuatro casillas una de otra. Prueba repetir 3: avanzar, avanzar, llamar desvío. Luego un último avanzar. O deja que un bloque «si» detecte las cajas.',
c5_win:'¡Sala de la linterna, allá voy! Ocho movimientos, escritos una vez y usados tres veces.',
c5_text:'Una función es un grupo de instrucciones con nombre que escribes una vez y usas cuando lo necesitas. Acorta los programas, y arreglarla en un sitio arregla todas las llamadas.',

c1_name:'Corredor',c1_title:'O corredor',
c1_i1:'Chiado e depois um clique. Do outro lado do rádio, uma pequena lâmpada pisca no escuro.',
c1_i2:'Operador? Estou ouvindo. Aviso: sou um robô muito literal. Faço exatamente o que você manda, na ordem em que manda.',
c1_i3:'O interruptor de energia fica no fim do corredor. Pode me guiar até lá?',
c1_task:'Escolha comandos na lista à direita e aperte Executar. Cada “avançar” move o Wick uma casa para onde ele está olhando. O anel com o raio é o interruptor.',
c1_h1:'Wick começa olhando para a direita. O interruptor fica três casas à direita e depois duas para baixo.',
c1_h2:'avançar, avançar, avançar, virar à direita, avançar, avançar.',
c1_win:'Interruptor ligado! A primeira lâmpada acendeu. Tudo o que fiz veio da sua lista, na sua ordem.',
c1_text:'Um programa é uma lista de instruções que rodam uma de cada vez, de cima para baixo. O computador não adivinha o que você quis dizer, então os passos exatos e a ordem importam.',
c2_name:'Escada',c2_title:'A escada',
c2_i1:'A escada até a sala da lanterna faz zigue-zague: um passo para cá, um passo para lá, de novo e de novo.',
c2_i2:'Eu poderia subir comando por comando, mas seriam vinte comandos. Tem como dizer “faça isso de novo”?',
c2_task:'Ideia nova: laços. Descubra o padrão, adicione um bloco repetir e defina quantas vezes ele roda. Os comandos que você adiciona depois de um repetir entram nele.',
c2_h1:'Os quatro primeiros movimentos são avançar, virar à direita, avançar, virar à esquerda. Depois os mesmos quatro se repetem.',
c2_h2:'Coloque esses quatro comandos dentro de um só bloco repetir e defina como 5.',
c2_win:'Cinco degraus com uma só ideia. Você pensou e o bloco repetir contou.',
c2_text:'Um laço repete um grupo de instruções para você não escrever a mesma coisa de novo e de novo. Você escolhe o que repetir e quantas vezes.',
c3_name:'Cofre',c3_title:'O cofre alagado',
c3_i1:'Depois da escada fica o corredor do cofre. A água se infiltrou e formou poças pelo chão.',
c3_i2:'Poças e meus circuitos não combinam. Só sinto a casa logo à minha frente, e posso pular uma poça se a vir.',
c3_i3:'Não enxergo todas as poças daqui. Posso decidir pelo caminho?',
c3_task:'Ideias novas: “se” e “repetir até”. Um bloco “se” verifica algo e executa um grupo de comandos ou o outro. “Repetir até” continua até o Wick chegar ao interruptor.',
c3_h1:'Antes de cada movimento, Wick deve olhar o que há à frente. Essa verificação precisa se repetir, então vai dentro de um laço.',
c3_h2:'repetir até o interruptor: se houver poça à frente, pular. Senão, avançar.',
c3_win:'Sequinho o caminho todo! Nunca precisei saber onde estavam as poças. Só olhei e decidi.',
c3_text:'Um bloco “se” executa um grupo de instruções quando uma pergunta é verdadeira e outro (o “senão”) quando não é. Com um laço, um programa lida com o que não previu.',
c4_name:'Patamares',c4_title:'Os patamares',
c4_i1:'Acima do cofre, a escada se abre em patamares. Cada patamar é uma casa mais comprido que o anterior.',
c4_i2:'Uma casa, depois duas, três, quatro. Um bloco repetir comum me daria o mesmo comprimento em toda volta, e isso está errado.',
c4_i3:'Preciso de um número que eu possa mudar pelo caminho. Pode me dar um lugar para guardá-lo?',
c4_task:'Ideia nova: variáveis. Uma variável é uma caixa com nome que guarda um valor. Defina n como 1, avance n casas e some 1 a n no fim de cada volta.',
c4_h1:'Uma volta é: avançar n, virar à direita, avançar, virar à esquerda e depois aumentar n. São quatro voltas.',
c4_h2:'definir n como 1. Depois repetir 4 vezes: avançar n, virar à direita, avançar, virar à esquerda, somar 1 a n.',
c4_win:'Quatro patamares, cada um uma casa maior, e um só laço deu conta de todos.',
c4_text:'Uma variável é um nome que guarda um valor, e esse valor pode mudar enquanto o programa roda. Aqui n começa em 1 e cresce um a cada volta, então o mesmo laço percorre um patamar maior a cada vez.',
c5_name:'Depósito',c5_title:'O depósito',
c5_i1:'A última sala antes da lanterna é o depósito. Há caixas empilhadas atravessando o corredor, com uma faixa lateral estreita ao lado de cada uma.',
c5_i2:'Toda vez é igual: um passo para o lado, passar, voltar. Oito movimentos, três caixas. Prefiro não ouvir isso vinte e quatro vezes.',
c5_i3:'Será que eu poderia aprender o desvio uma vez e dar um nome a ele?',
c5_task:'Ideia nova: funções. Monte o desvio na caixa de rotina e use chamar desvio onde o Wick precisar. Mude a rotina e todas as chamadas mudam junto.',
c5_h1:'O desvio é: virar à esquerda, avançar, virar à direita, avançar, avançar, virar à direita, avançar, virar à esquerda. Monte uma vez na caixa de rotina.',
c5_h2:'As caixas estão a quatro casas uma da outra. Tente repetir 3: avançar, avançar, chamar desvio. Depois um último avançar. Ou deixe um bloco “se” enxergar as caixas.',
c5_win:'Sala da lanterna, lá vou eu! Oito movimentos, escritos uma vez e usados três vezes.',
c5_text:'Uma função é um grupo de instruções com nome que você escreve uma vez e usa sempre que precisar. Ela deixa os programas curtos, e consertá-la num lugar conserta todas as chamadas.',

share_text:'Ich habe alle fünf Lampen in „Wick und die dunkle Station“ entzündet und {n} Punkte geholt. Schaffst du mehr?',

card_beat:'Schaffst du mehr?',card_lamps:'Lampen an: {n} von 5',card_help:'Halte das Bild gedrückt, um es zu speichern, und teile es, wo du willst.',
k1:'Folge',kl1:'Anweisungen laufen der Reihe nach, eine nach der anderen.',
k2:'Schleifen',kl2:'Eine Gruppe wiederholen, statt sie neu zu schreiben.',
k3:'Bedingungen',kl3:'Entscheiden, was zu tun ist, je nachdem, was gerade zutrifft.',

c1_name:'Flur',c1_title:'Der Flur',
c1_i1:'Rauschen, dann ein Klick. Am anderen Ende des Funkgeräts flackert eine kleine Lampe im Dunkeln auf.',
c1_i2:'Operator? Ich höre dich. Ich warne dich: Ich bin ein sehr wörtlicher Roboter. Ich tue genau das, was du mir sagst, in der Reihenfolge, in der du es sagst.',
c1_i3:'Der Hauptschalter ist am Ende des Flurs. Kannst du mich dorthin lotsen?',
c1_task:'Wähle Befehle aus der Liste rechts und drücke Starten. Jedes „vorwärts“ bewegt Wick ein Feld in Blickrichtung. Der Ring mit dem Blitz ist der Schalter.',
c1_h1:'Wick schaut anfangs nach rechts. Der Schalter ist drei Felder rechts und dann zwei Felder nach unten.',
c1_h2:'vorwärts, vorwärts, vorwärts, rechts drehen, vorwärts, vorwärts.',
c1_win:'Der Schalter ist an! Die erste Lampe leuchtet. Alles, was ich getan habe, stammt aus deiner Liste, in deiner Reihenfolge.',
c1_text:'Ein Programm ist eine Liste von Anweisungen, die nacheinander von oben nach unten laufen. Der Computer kann nicht erraten, was du gemeint hast, also zählen die genauen Schritte und ihre Reihenfolge.',
c2_name:'Treppe',c2_title:'Die Treppe',
c2_i1:'Die Treppe zum Laternenraum verläuft im Zickzack: ein Schritt hierhin, ein Schritt dorthin, immer wieder.',
c2_i2:'Ich könnte sie Befehl für Befehl hinaufsteigen, aber das wären zwanzig Befehle. Gibt es eine Möglichkeit zu sagen: „Mach das nochmal“?',
c2_task:'Neue Idee: Schleifen. Erkenne das Muster, füge einen Wiederholen-Block hinzu und stelle ein, wie oft er läuft. Befehle, die du nach einem Wiederholen hinzufügst, landen darin.',
c2_h1:'Die ersten vier Bewegungen sind vorwärts, rechts drehen, vorwärts, links drehen. Danach geschehen dieselben vier wieder.',
c2_h2:'Lege diese vier Befehle in einen einzigen Wiederholen-Block und stelle ihn auf 5.',
c2_win:'Fünf Stufen mit einer Idee. Du hast gedacht, und der Wiederholen-Block hat gezählt.',
c2_text:'Eine Schleife wiederholt eine Gruppe von Anweisungen, damit du nicht immer wieder dasselbe schreiben musst. Du bestimmst, was und wie oft wiederholt wird.',
c3_name:'Gewölbe',c3_title:'Das geflutete Gewölbe',
c3_i1:'Hinter der Treppe liegt der Gewölbegang. Wasser ist eingedrungen und hat sich in Lachen auf dem Boden gesammelt.',
c3_i2:'Pfützen und meine Schaltkreise vertragen sich nicht. Ich spüre nur das Feld direkt vor mir, und ich kann über eine Pfütze springen, wenn ich sie sehe.',
c3_i3:'Von hier sehe ich nicht alle Pfützen. Kann ich unterwegs entscheiden?',
c3_task:'Neue Ideen: „wenn“ und „wiederholen bis“. Ein Wenn-Block prüft etwas und führt dann die eine oder die andere Befehlsgruppe aus. „Wiederholen bis“ macht weiter, bis Wick den Schalter erreicht.',
c3_h1:'Vor jedem Schritt sollte Wick prüfen, was voraus liegt. Diese Prüfung muss immer wieder passieren, also gehört sie in eine Schleife.',
c3_h2:'wiederholen bis zum Schalter: wenn Pfütze voraus, springen. Sonst vorwärts.',
c3_win:'Trocken bis ans Ende! Ich musste nie wissen, wo die Pfützen sind. Ich habe nur geschaut und dann entschieden.',
c3_text:'Ein Wenn-Block führt eine Gruppe von Anweisungen aus, wenn eine Frage wahr ist, und eine andere (den Sonst-Teil), wenn nicht. Zusammen mit einer Schleife kann ein Programm mit Dingen umgehen, die es nie kommen sah.',
c4_name:'Absätze',c4_title:'Die Treppenabsätze',
c4_i1:'Über dem Gewölbe öffnet sich die Treppe zu Absätzen. Jeder Absatz ist ein Feld länger als der vorherige.',
c4_i2:'Ein Feld, dann zwei, dann drei, dann vier. Ein einfacher Wiederholen-Block würde mir jede Runde dieselbe Länge geben, und das ist falsch.',
c4_i3:'Ich brauche eine Zahl, die ich unterwegs ändern kann. Kannst du mir einen Platz geben, wo ich sie aufbewahre?',
c4_task:'Neue Idee: Variablen. Eine Variable ist eine benannte Kiste, die einen Wert enthält. Setze n auf 1, gehe n Felder vorwärts und erhöhe n am Ende jeder Runde um 1.',
c4_h1:'Eine Runde ist: n vorwärts, rechts drehen, vorwärts, links drehen, dann n größer machen. Es gibt vier Runden.',
c4_h2:'n auf 1 setzen. Dann 4 Mal wiederholen: n vorwärts, rechts drehen, vorwärts, links drehen, n um 1 erhöhen.',
c4_win:'Vier Absätze, jeder ein Feld länger, und eine einzige Schleife hat sie alle geschafft.',
c4_text:'Eine Variable ist ein Name, der einen Wert enthält, und der Wert kann sich ändern, während das Programm läuft. Hier beginnt n bei 1 und wächst jede Runde um eins, sodass dieselbe Schleife jedes Mal einen längeren Absatz abläuft.',
c5_name:'Lager',c5_title:'Das Lager',
c5_i1:'Der letzte Raum vor der Lampe ist das Lager. Kisten stehen quer im Gang, neben jeder gibt es eine schmale Ausweichspur.',
c5_i2:'Jedes Mal dasselbe: zur Seite treten, vorbeigehen, zurücktreten. Acht Bewegungen, drei Kisten. Ich möchte sie nicht vierundzwanzigmal hören.',
c5_i3:'Könnte ich den Umweg einmal lernen und ihm einen Namen geben?',
c5_task:'Neue Idee: Funktionen. Baue den Umweg im Routine-Kasten und benutze Umweg aufrufen überall, wo Wick ihn braucht. Ändere die Routine, und jeder Aufruf ändert sich mit.',
c5_h1:'Der Umweg ist: links drehen, vorwärts, rechts drehen, vorwärts, vorwärts, rechts drehen, vorwärts, links drehen. Baue ihn einmal im Routine-Kasten.',
c5_h2:'Die Kisten stehen vier Felder auseinander. Versuche 3 Mal wiederholen: vorwärts, vorwärts, Umweg aufrufen. Dann ein letztes Mal vorwärts. Oder lass einen Wenn-Block die Kisten erkennen.',
c5_win:'Laternenraum, ich komme! Acht Bewegungen, einmal geschrieben und dreimal benutzt.',
c5_text:'Eine Funktion ist eine benannte Gruppe von Anweisungen, die du einmal schreibst und immer benutzt, wenn du sie brauchst. Sie hält Programme kurz, und wer sie an einer Stelle repariert, repariert jeden Aufruf.',

c1_name:'Corridoio',c1_title:'Il corridoio',
c1_i1:'Fruscio, poi un clic. All’altro capo della radio, una piccola lampada si accende nel buio.',
c1_i2:'Operatore? Ti sento. Ti avviso: sono un robot molto letterale. Faccio esattamente ciò che mi dici, nell’ordine in cui me lo dici.',
c1_i3:'L’interruttore dell’energia è in fondo al corridoio. Mi ci guidi?',
c1_task:'Scegli i comandi dalla lista a destra, poi premi Avvia. Ogni «avanti» muove Wick di una casella nella direzione in cui guarda. L’anello con il fulmine è l’interruttore.',
c1_h1:'Wick parte rivolto a destra. L’interruttore è tre caselle a destra e poi due in basso.',
c1_h2:'avanti, avanti, avanti, gira a destra, avanti, avanti.',
c1_win:'Interruttore attivato! La prima lampada è accesa. Tutto ciò che ho fatto veniva dalla tua lista, nel tuo ordine.',
c1_text:'Un programma è una lista di istruzioni eseguite una alla volta, dall’alto in basso. Il computer non può indovinare cosa intendevi, quindi contano i passi esatti e il loro ordine.',
c2_name:'Scala',c2_title:'La scala',
c2_i1:'La scala verso la sala della lanterna procede a zigzag: un passo di qua, un passo di là, ancora e ancora.',
c2_i2:'Potrei salirla un comando alla volta, ma sarebbero venti comandi. C’è un modo per dire «fai di nuovo questo»?',
c2_task:'Nuova idea: i cicli. Individua lo schema, aggiungi un blocco ripeti e imposta quante volte va eseguito. I comandi che aggiungi dopo un ripeti vanno al suo interno.',
c2_h1:'I primi quattro movimenti sono avanti, gira a destra, avanti, gira a sinistra. Poi gli stessi quattro si ripetono.',
c2_h2:'Metti quei quattro comandi dentro un solo blocco ripeti impostato a 5.',
c2_win:'Cinque gradini con una sola idea. Tu hai pensato e il blocco ripeti ha contato.',
c2_text:'Un ciclo ripete un gruppo di istruzioni, così non devi scrivere la stessa cosa ancora e ancora. Scegli cosa ripetere e quante volte.',
c3_name:'Cripta',c3_title:'La cripta allagata',
c3_i1:'Oltre la scala c’è il corridoio della cripta. L’acqua si è infiltrata e ha formato pozze sul pavimento.',
c3_i2:'Le pozze e i miei circuiti non vanno d’accordo. Sento solo la casella proprio davanti a me, e posso saltare una pozza se la vedo.',
c3_i3:'Da qui non vedo tutte le pozze. Posso decidere strada facendo?',
c3_task:'Nuove idee: «se» e «ripeti fino a». Un blocco «se» controlla qualcosa, poi esegue l’uno o l’altro gruppo di comandi. «Ripeti fino a» continua finché Wick non raggiunge l’interruttore.',
c3_h1:'Prima di ogni mossa, Wick deve controllare cosa c’è davanti. Questo controllo deve ripetersi sempre, quindi va dentro un ciclo.',
c3_h2:'ripeti fino all’interruttore: se c’è una pozza avanti, salta. Altrimenti, avanti.',
c3_win:'Asciutto fino in fondo! Non ho mai avuto bisogno di sapere dove fossero le pozze. Ho guardato e poi ho deciso.',
c3_text:'Un blocco «se» esegue un gruppo di istruzioni quando una domanda è vera e un altro (la parte «altrimenti») quando non lo è. Insieme a un ciclo, un programma può gestire ciò che non aveva previsto.',
c4_name:'Pianerottoli',c4_title:'I pianerottoli',
c4_i1:'Sopra la cripta, la scala si apre su dei pianerottoli. Ogni pianerottolo è una casella più lungo del precedente.',
c4_i2:'Una casella, poi due, poi tre, poi quattro. Un semplice blocco ripeti mi darebbe la stessa lunghezza a ogni giro, ed è sbagliato.',
c4_i3:'Mi serve un numero che possa cambiare strada facendo. Puoi darmi un posto dove tenerlo?',
c4_task:'Nuova idea: le variabili. Una variabile è una scatola con un nome che contiene un valore. Imposta n a 1, avanza di n caselle e aggiungi 1 a n alla fine di ogni giro.',
c4_h1:'Un giro è: avanti di n, gira a destra, avanti, gira a sinistra, poi ingrandisci n. I giri sono quattro.',
c4_h2:'imposta n a 1. Poi ripeti 4 volte: avanti di n, gira a destra, avanti, gira a sinistra, aggiungi 1 a n.',
c4_win:'Quattro pianerottoli, ciascuno una casella più lungo, e un solo ciclo li ha gestiti tutti.',
c4_text:'Una variabile è un nome che contiene un valore, e il valore può cambiare mentre il programma gira. Qui n parte da 1 e cresce di uno a ogni giro, quindi lo stesso ciclo percorre ogni volta un pianerottolo più lungo.',
c5_name:'Magazzino',c5_title:'Il magazzino',
c5_i1:'L’ultima stanza prima della lanterna è il magazzino. Delle casse sono impilate di traverso nel corridoio, con una stretta corsia laterale accanto a ciascuna.',
c5_i2:'Ogni volta è uguale: un passo di lato, passare, tornare indietro. Otto mosse, tre casse. Preferisco non sentirle ventiquattro volte.',
c5_i3:'Potrei imparare la deviazione una volta sola e darle un nome?',
c5_task:'Nuova idea: le funzioni. Costruisci la deviazione nella casella routine, poi usa chiama deviazione dove serve a Wick. Cambia la routine e ogni chiamata cambia con lei.',
c5_h1:'La deviazione è: gira a sinistra, avanti, gira a destra, avanti, avanti, gira a destra, avanti, gira a sinistra. Costruiscila una volta nella casella routine.',
c5_h2:'Le casse sono a quattro caselle l’una dall’altra. Prova ripeti 3: avanti, avanti, chiama deviazione. Poi un ultimo avanti. Oppure lascia che un blocco «se» individui le casse.',
c5_win:'Sala della lanterna, arrivo! Otto mosse, scritte una volta e usate tre volte.',
c5_text:'Una funzione è un gruppo di istruzioni con un nome che scrivi una volta e usi quando ti serve. Accorcia i programmi, e correggerla in un punto corregge ogni chiamata.',

c1_name:'Koridor',c1_title:'Koridor',
c1_i1:'Cızırtı, sonra bir tık. Telsizin öbür ucunda karanlıkta küçük bir lamba yanıp sönüyor.',
c1_i2:'Operatör? Seni duyuyorum. Önceden söyleyeyim, ben çok harfiyen bir robotum. Ne dersen, dediğin sırayla tam olarak onu yaparım.',
c1_i3:'Elektrik şalteri koridorun sonunda. Beni oraya yönlendirebilir misin?',
c1_task:'Sağdaki listeden komutlar seç, sonra Çalıştır’a bas. Her “ileri” Wick’i baktığı yöne bir kare götürür. Yıldırımlı halka şalterdir.',
c1_h1:'Wick başlangıçta sağa bakıyor. Şalter üç kare sağda, sonra iki kare aşağıda.',
c1_h2:'ileri, ileri, ileri, sağa dön, ileri, ileri.',
c1_win:'Şalter açıldı! İlk lamba yandı. Yaptığım her şey senin listenden, senin sıranla geldi.',
c1_text:'Program, yukarıdan aşağıya birer birer çalışan komutlar listesidir. Bilgisayar ne demek istediğini tahmin edemez; bu yüzden tam adımlar ve sıraları önemlidir.',
c2_name:'Merdiven',c2_title:'Merdiven',
c2_i1:'Fener odasına çıkan merdiven zikzak çiziyor: bir adım buraya, bir adım şuraya, tekrar tekrar.',
c2_i2:'Komut komut çıkabilirim ama bu yirmi komut eder. “Bunu tekrar yap” demenin bir yolu yok mu?',
c2_task:'Yeni fikir: döngüler. Deseni fark et, bir tekrarla bloğu ekle ve kaç kez çalışacağını ayarla. Tekrarla bloğundan sonra eklediğin komutlar onun içine girer.',
c2_h1:'İlk dört hareket: ileri, sağa dön, ileri, sola dön. Sonra aynı dördü yine olur.',
c2_h2:'Bu dört komutu tek bir tekrarla bloğunun içine koy ve 5 yap.',
c2_win:'Tek fikirle beş basamak. Sen düşündün, tekrarla bloğu saydı.',
c2_text:'Döngü, aynı şeyi tekrar tekrar yazmak zorunda kalmamak için bir komut grubunu tekrarlar. Neyi ve kaç kez tekrarlayacağını sen seçersin.',
c3_name:'Kasa',c3_title:'Su basmış kasa dairesi',
c3_i1:'Merdivenin ardında kasa koridoru var. Su sızmış ve zeminde birikintiler oluşturmuş.',
c3_i2:'Su birikintileri ve devrelerim anlaşamaz. Sadece tam önümdeki kareyi algılayabiliyorum ve bir birikinti görürsem üstünden zıplayabilirim.',
c3_i3:'Buradan tüm birikintileri göremiyorum. Yolda karar verebilir miyim?',
c3_task:'Yeni fikirler: “eğer” ve “şuna kadar tekrarla”. Eğer bloğu bir şeyi kontrol eder, sonra komut gruplarından birini çalıştırır. “Şuna kadar tekrarla”, Wick şaltere ulaşana kadar devam eder.',
c3_h1:'Her harekette önce Wick ileride ne olduğuna bakmalı. Bu kontrol tekrar tekrar olmalı, bu yüzden bir döngünün içine girer.',
c3_h2:'şaltere kadar tekrarla: eğer ileride su birikintisi varsa zıpla, değilse ileri.',
c3_win:'Baştan sona kuru! Birikintilerin nerede olduğunu hiç bilmem gerekmedi. Sadece baktım, sonra karar verdim.',
c3_text:'Eğer bloğu, bir soru doğruysa bir komut grubunu, değilse bir başkasını (değilse kısmı) çalıştırır. Döngüyle birlikte program, hiç beklemediği durumlarla da başa çıkabilir.',
c4_name:'Sahanlıklar',c4_title:'Sahanlıklar',
c4_i1:'Kasa dairesinin üstünde merdiven sahanlıklara açılıyor. Her sahanlık bir öncekinden bir kare daha uzun.',
c4_i2:'Bir kare, sonra iki, üç, dört. Sade bir tekrarla bloğu her turda bana aynı uzunluğu verirdi ve bu yanlış.',
c4_i3:'Yolda değiştirebileceğim bir sayıya ihtiyacım var. Bana onu saklayacağım bir yer verebilir misin?',
c4_task:'Yeni fikir: değişkenler. Değişken, bir değer tutan adı olan bir kutudur. n’yi 1 yap, n kare ileri git ve her turun sonunda n’ye 1 ekle.',
c4_h1:'Bir tur şöyle: n kadar ileri, sağa dön, ileri, sola dön, sonra n’yi büyüt. Toplam dört tur var.',
c4_h2:'n’yi 1 yap. Sonra 4 kez tekrarla: n kadar ileri, sağa dön, ileri, sola dön, n’ye 1 ekle.',
c4_win:'Dört sahanlık, her biri bir kare daha uzun ve tek bir döngü hepsini hallettin.',
c4_text:'Değişken, bir değer tutan bir addır ve değer program çalışırken değişebilir. Burada n 1’den başlar ve her turda bir artar; böylece aynı döngü her seferinde daha uzun bir sahanlığı yürür.',
c5_name:'Depo',c5_title:'Depo',
c5_i1:'Fenerden önceki son oda depo. Koridoru kesen sandıklar var, her birinin yanında dar bir yan şerit var.',
c5_i2:'Her seferinde aynı: yana adım at, geç, geri adım at. Sekiz hareket, üç sandık. Bunları yirmi dört kez duymak istemem.',
c5_i3:'Dolambacı bir kez öğrenip ona bir ad verebilir miyim?',
c5_task:'Yeni fikir: fonksiyonlar. Dolambacı rutin kutusunda kur, sonra Wick’in ihtiyaç duyduğu her yerde dolambaç çağır komutunu kullan. Rutini değiştirirsen her çağrı onunla birlikte değişir.',
c5_h1:'Dolambaç: sola dön, ileri, sağa dön, ileri, ileri, sağa dön, ileri, sola dön. Rutin kutusunda bir kez kur.',
c5_h2:'Sandıklar dört kare arayla duruyor. 3 kez tekrarla dene: ileri, ileri, dolambaç çağır. Sonra son bir ileri. Ya da sandıkları bir eğer bloğunun fark etmesine izin ver.',
c5_win:'Fener odası, geliyorum! Sekiz hareket, bir kez yazıldı, üç kez kullanıldı.',
c5_text:'Fonksiyon, bir kez yazıp ihtiyaç duydukça kullandığın adlandırılmış bir komut grubudur. Programları kısa tutar ve onu bir yerde düzeltmek her çağrıyı düzeltir.',

c1_i1:'Шорох, потом щелчок. На другом конце рации в темноте загорается маленькая лампочка.',
c1_i2:'Оператор? Я тебя слышу. Предупреждаю: я очень буквальный робот. Я делаю ровно то, что ты говоришь, в том порядке, в котором ты говоришь.',
c1_i3:'Рубильник питания в конце коридора. Проведёшь меня туда?',
c1_task:'Выбери команды из списка справа и нажми «Запуск». Каждое «вперёд» двигает Wick на одну клетку в ту сторону, куда он смотрит. Кольцо с молнией — это рубильник.',

c1_h2:'вперёд, вперёд, вперёд, повернуть направо, вперёд, вперёд.',
c1_win:'Рубильник включён! Первая лампа горит. Всё, что я делал, взято из твоего списка, в твоём порядке.',
c1_text:'Программа — это список команд, которые выполняются по одной, сверху вниз. Компьютер не может угадать, что ты имел в виду, поэтому важны точные шаги и их порядок.',

c2_i2:'Я мог бы подняться по ней команда за командой, но это двадцать команд. Можно как-то сказать «сделай это ещё раз»?',

c2_h1:'Первые четыре движения: вперёд, повернуть направо, вперёд, повернуть налево. Потом те же четыре повторяются.',
c2_h2:'Положи эти четыре команды в один блок «повторить» и поставь 5.',

c3_i3:'Отсюда я не вижу всех луж. Можно решать по ходу дела?',
c3_task:'Новые идеи: «если» и «повторять, пока». Блок «если» что-то проверяет и выполняет одну или другую группу команд. «Повторять, пока» продолжает, пока Wick не дойдёт до рубильника.',

c3_win:'Сухим до конца! Мне ни разу не пришлось знать, где лужи. Я просто смотрел, а потом решал.',
c3_text:'Блок «если» выполняет одну группу команд, когда вопрос верен, и другую (часть «иначе»), когда нет. В паре с циклом программа справляется с тем, чего не ожидала.',

c5_name:'Кладовая',c5_title:'Кладовая',
c5_i1:'Последняя комната перед фонарём — кладовая. Ящики стоят поперёк коридора, а рядом с каждым есть узкая боковая полоса.',

<script>
(function(){
'use strict';
var ORDER = ['en','ar','fr','es','pt','de','it','tr','ru','zh','ja','ko'];
var CFG = (typeof window!=='undefined' && window.WICK_CONFIG) || {};
var HOSTED = !!CFG.hosted;
var LB_URL = String(CFG.leaderboard||'').replace(/\/+$/,'');
function shareUrl(){
  if(CFG.shareUrl) return CFG.shareUrl;
  try{ if(HOSTED && window.top===window && /^https?:$/.test(location.protocol)) return location.origin+location.pathname.replace(/index\.html$/,''); }catch(e){}
  return '';
}
var HASHTAGS = '#WickAndTheDarkStation #LearnToCode';

/* ================================================================
   Levels (text lives in the language files)
   ================================================================ */
/*ENGINE-START*/
var CHAPTERS = [
  { grid:['      ','S...  ','   .  ','   G  '], par:6, palette:['forward','left','right'], sp:'nww' },
  { grid:['S.    ',' ..   ','  ..  ','   .. ','    ..','     G'], par:5, palette:['forward','left','right','repeat'], sp:'nw' },
  { grid:['############','S..P..P..P.G','############'], par:4, cond:'puddle', palette:['forward','left','right','jump','repeat','until','if'], sp:'nww' },
  { grid:['S.         ',' ...       ','   ....    ','      .....','          G'], par:7, useVar:true, palette:['forward','left','right','repeat','set','add','forwardn'], sp:'nww' },
  { grid:['##############','##...#...#...#','S..X...X...X.G'], par:12, cond:'crate', useFn:true, palette:['forward','left','right','repeat','until','if','call'], sp:'nww' }
];
var CODES = ['forward()\nturn_right()\nforward()','for _ in range(5):\n    forward()\n    turn_right()','if puddle_ahead():\n    jump()\nelse:\n    forward()','n = 1\nforward(n)\nn = n + 1','def detour():\n    turn_left()\n    forward()\n\ndetour()'];
var DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
var SKINS = [
  {l:['#2f5964','#183840'], d:['#d6e6e1','#6f9a9b']},
  {l:['#c4492f','#7a2616'], d:['#ff9d85','#c4573f']},
  {l:['#2f8a5b','#175034'], d:['#9be3bd','#4aa57a']},
  {l:['#6b4bb3','#3b2670'], d:['#c7b2ff','#7f64cc']},
  {l:['#b57a0b','#6b4400'], d:['#ffd27a','#c99a2e']},
  {l:['#c43d7a','#7a1b48'], d:['#ffa6cc','#d0679a']}
];
function parseGrid(rows){
  var h = rows.length, w = rows[0].length, g = [], start = null;
  for(var y=0;y<h;y++){
    g.push([]);
    for(var x=0;x<w;x++){
      var c = rows[y].charAt(x) || ' ';
      if(c==='S'){ start = {x:x,y:y}; c = '.'; }
      g[y].push(c);
    }
  }
  return {w:w,h:h,g:g,start:start};
}
CHAPTERS.forEach(function(c){ c.parsed = parseGrid(c.grid); c.startRot = 90; });

/* ================================================================
   Engine: runs a program one action at a time (a generator)
   ================================================================ */
function Fail(key, hit){ this.key = key; this.hit = hit || null; }
function Win(){}
function tileAt(grid,x,y){ if(x<0||y<0||x>=grid.w||y>=grid.h) return ' '; return grid.g[y][x]; }
function dirOf(ctx){ return (((ctx.rot/90)%4)+4)%4; }
function newCtx(level, fnList){
  var s = level.parsed.start;
  return {level:level, grid:level.parsed, x:s.x, y:s.y, rot:level.startRot, n:null, ticks:0, stack:[], fn:fnList, zap:false, check:null, errNode:null};
}
function ahead(ctx,k){ var d = DIRS[dirOf(ctx)]; return {x:ctx.x+d[0]*k, y:ctx.y+d[1]*k}; }
function needVar(ctx){ if(ctx.n===null) throw new Fail('e_var'); }
function* moveOne(ctx,node){
  var p = ahead(ctx,1), t = tileAt(ctx.grid,p.x,p.y);
  if(t===' ') throw new Fail('e_edge');
  if(t==='#') throw new Fail('e_wall', p);
  if(t==='X') throw new Fail('e_crate', p);
  ctx.x = p.x; ctx.y = p.y;
  if(t==='P'){ ctx.zap = true; throw new Fail('e_puddle', p); }
  if(t==='G') throw new Win();
  yield {id:node.id};
}
function* doForward(ctx,node,k){ for(var i=0;i<k;i++){ yield* moveOne(ctx,node); } }
function* doJump(ctx,node){
  var m = ahead(ctx,1), l = ahead(ctx,2);
  var tm = tileAt(ctx.grid,m.x,m.y), tl = tileAt(ctx.grid,l.x,l.y);
  if(tm==='#'||tm==='X') throw new Fail('e_jmid', m);
  if(tl===' ') throw new Fail('e_jedge');
  if(tl==='#') throw new Fail('e_jwall', l);
  if(tl==='X') throw new Fail('e_jcrate', l);
  ctx.x = l.x; ctx.y = l.y;
  if(tl==='P'){ ctx.zap = true; throw new Fail('e_jpuddle', l); }
  if(tl==='G') throw new Win();
  yield {id:node.id};
}
function checkCond(ctx,cond){
  var p = ahead(ctx,1), t = tileAt(ctx.grid,p.x,p.y);
  if(cond==='puddle') return t==='P';
  if(cond==='crate') return t==='X';
  return false;
}
function* execList(list,ctx){ for(var i=0;i<list.length;i++){ yield* execNode(list[i],ctx); } }
function* execNode(node,ctx){
  if(++ctx.ticks>4000) throw new Fail('e_many');
  ctx.stack.push(node.id);
  try{
    switch(node.type){
      case 'forward': yield* doForward(ctx,node,1); break;
      case 'forwardn': needVar(ctx); yield* doForward(ctx,node,Math.min(ctx.n,60)); break;
      case 'jump': yield* doJump(ctx,node); break;
      case 'left': ctx.rot -= 90; yield {id:node.id}; break;
      case 'right': ctx.rot += 90; yield {id:node.id}; break;
      case 'set': ctx.n = node.k; yield {id:node.id}; break;
      case 'add': needVar(ctx); ctx.n += 1; yield {id:node.id}; break;
      case 'repeat':
        for(var i=0;i<node.count;i++){ yield* execList(node.body,ctx); }
        break;
      case 'until': {
        if(node.body.length===0) throw new Fail('e_untilempty');

          var key = ctx.x+','+ctx.y+','+((((ctx.rot%360)+360)%360))+','+ctx.n;
          if(seen[key] || ++guard>400) throw new Fail('e_loop');
          seen[key] = true;
          yield* execList(node.body,ctx);
        }
      }
      case 'if': {
        var res = checkCond(ctx,node.cond);
        ctx.check = {id:node.id, cond:node.cond, res:res};
        yield {id:node.id, check:true};
        yield* execList(res ? node.body : node.elseBody, ctx);
        break;
      }
      case 'call':
        if(ctx.fn.length===0) throw new Fail('e_fnempty');
        yield {id:node.id};
        yield* execList(ctx.fn,ctx);
        break;
    }
  }catch(e){
    if(e instanceof Fail && !ctx.errNode) ctx.errNode = node.id;
    throw e;
  }finally{
    ctx.stack.pop();
  }
}

    if(e instanceof Win) return {result:'won', ctx:ctx, steps:steps};

}

}

function makeNode(type){
  var n = {id:'n'+(S.nid++), type:type};
  if(type==='repeat'){ n.count = 3; n.body = []; }
  if(type==='until'){ n.body = []; }
  if(type==='if'){ n.cond = cur().cond || 'puddle'; n.body = []; n.elseBody = []; }
  if(type==='set'){ n.k = 1; }
  return n;
}
function findNode(id){
  function walk(list,listId,root){
    for(var i=0;i<list.length;i++){
      var n = list[i];
      if(n.id===id) return {node:n, list:list, index:i, listId:listId, root:root};
      if(n.body){ var a = walk(n.body, n.id, root); if(a) return a; }
      if(n.elseBody){ var b = walk(n.elseBody, n.id+'e', root); if(b) return b; }
    }
    return null;
  }
  return walk(S.main,'main','main') || walk(S.fn,'fn','fn');
}
function getList(id){
  if(id==='main') return S.main;
  if(id==='fn') return S.fn;
  var isElse = id.charAt(id.length-1)==='e';
  var f = findNode(isElse ? id.slice(0,-1) : id);
  if(!f) return null;
  return isElse ? f.node.elseBody : f.node.body;
}
function rootOf(listId){
  if(listId==='main') return 'main';
  if(listId==='fn') return 'fn';
  var isElse = listId.charAt(listId.length-1)==='e';
  var f = findNode(isElse ? listId.slice(0,-1) : listId);
  return f ? f.root : 'main';
}
function countBlocks(list){
  var c = 0;
  list.forEach(function(n){ c++; if(n.body) c += countBlocks(n.body); if(n.elseBody) c += countBlocks(n.elseBody); });
  return c;
}
function totalBlocks(){ return countBlocks(S.main) + countBlocks(S.fn); }
function labelOf(n){
  switch(n.type){
    case 'forward': case 'left': case 'right': case 'jump': case 'forwardn': case 'add': case 'call': case 'repeat': return t('c_'+n.type);
    case 'set': return t('n_set');
    case 'until': return t('n_until');
    case 'if': return t('n_if_'+n.cond);
  }
  return n.type;
}
function pyLines(list, indent, out){
  var pad = new Array(indent+1).join('    ');
  list.forEach(function(n){
    switch(n.type){
      case 'forward': out.push({id:n.id, t:pad+'forward()'}); break;
      case 'forwardn': out.push({id:n.id, t:pad+'forward(n)'}); break;
      case 'left': out.push({id:n.id, t:pad+'turn_left()'}); break;
      case 'right': out.push({id:n.id, t:pad+'turn_right()'}); break;
      case 'jump': out.push({id:n.id, t:pad+'jump()'}); break;
      case 'set': out.push({id:n.id, t:pad+'n = '+n.k}); break;
      case 'add': out.push({id:n.id, t:pad+'n = n + 1'}); break;
      case 'call': out.push({id:n.id, t:pad+'detour()'}); break;
      case 'repeat':
        out.push({id:n.id, t:pad+'for _ in range('+n.count+'):'});
        if(n.body.length) pyLines(n.body, indent+1, out); else out.push({id:n.id+'p', t:pad+'    pass'});
        break;
      case 'until':
        out.push({id:n.id, t:pad+'while not at_switch():'});
        if(n.body.length) pyLines(n.body, indent+1, out); else out.push({id:n.id+'p', t:pad+'    pass'});
        break;
      case 'if':
        out.push({id:n.id, t:pad+'if '+n.cond+'_ahead():'});
        if(n.body.length) pyLines(n.body, indent+1, out); else out.push({id:n.id+'p', t:pad+'    pass'});
        if(n.elseBody.length){ out.push({id:n.id+'else', t:pad+'else:'}); pyLines(n.elseBody, indent+1, out); }
        break;
    }
  });
}
function buildPython(){
  var out = [];
  if(cur().useFn){
    out.push({id:'def', t:'def detour():'});
    if(S.fn.length) pyLines(S.fn,1,out); else out.push({id:'defp', t:'    pass'});
    out.push({id:'sp', t:''});
  }
  if(S.main.length) pyLines(S.main,0,out); else out.push({id:'empty', t:t('code_empty'), cm:true});
  return out;
}

  $$('.node.cur,.node.in,.node.err,.cl.cur,.cl.in,.cl.err').forEach(function(e){ e.classList.remove('cur','in','err'); });
  function mark(id, cls){

function startTimer(){ if(!S.t0) S.t0 = Date.now(); }
function isTerminal(){ return R.status==='won' || R.status==='failed' || R.status==='done'; }
function resetState(){ clearTimeout(R.timer); R.gen = null; R.ctx = null; R.status = 'idle'; }
function resetRun(){
  resetState();
  var w = $('#wick');
  if(w){ w.classList.remove('bump','zap','cheer'); w.classList.add('snap'); updateWick(); void w.offsetWidth; w.classList.remove('snap'); }
  $$('.t.hit,.t.lit,.t.trail').forEach(function(x){ x.classList.remove('hit','lit','trail'); });
  $$('.fx,.bubble').forEach(function(e){ if(e.parentNode) e.parentNode.removeChild(e); });
  var bd = $('.board'); if(bd) bd.classList.remove('win');
  highlight(null,[],null);
  updateVar(); updateRunBtn();
  var r = $('#result'); if(r) r.innerHTML = '';
  setStatus(defaultStatus());
}
function advance(){
  if(!R.gen){ R.ctx = newCtx(cur(), S.fn); R.gen = execList(S.main, R.ctx); }
  try{
    var px = R.ctx.x, py = R.ctx.y;
    var r = R.gen.next();
    if(r.done){ onDone(); return false; }
    updateWick(); updateVar();
    highlight(r.value.id, R.ctx.stack, null);
    if(R.ctx.x!==px || R.ctx.y!==py){ var tt = $('#t-'+px+'-'+py); if(tt) tt.classList.add('trail'); }
    if(r.value.check){
      var c = R.ctx.check, cl = t('cond_'+c.cond);
      setStatus(t('st_check',{c:cl, r:c.res?t('yes'):t('no')}));
      showBubble(px, py, cl+'? '+(c.res?t('b_yes'):t('b_no')), c.res);
      sfx(c.res ? 'yes' : 'no');
    }else{
      var fn = findNode(r.value.id), ty = fn ? fn.node.type : '';
      if(ty==='forward' || ty==='forwardn') sfx('step');
      else if(ty==='left' || ty==='right') sfx('turn');
      else if(ty==='jump'){ sfx('jump'); burst(px, py, 'var(--muted)', 7, 26); }
      else if(ty==='set' || ty==='add') sfx('set');
      else if(ty==='call') sfx('call');
    }

      S.hint = Math.min(S.hint+1, 2); S.hintsUsed = Math.max(S.hintsUsed, S.hint); renderHint(); break;
    case 'lang': setLang(el.getAttribute('data-v')); rerender(); break;
    case 'skin': S.skin = parseInt(el.getAttribute('data-i'),10); applyLook(); save(); var c1 = $('.custom'); if(c1) c1.outerHTML = customHtml(); break;
    case 'theme': S.theme = el.getAttribute('data-v'); applyLook(); save(); var c2 = $('.custom'); if(c2) c2.outerHTML = customHtml(); break;
    case 'share': openShare(); break;
    case 'hs': renderLb(); break;
    case 'lbback': lbBack(); break;
    case 'lbtab': S.lbTab = el.getAttribute('data-v')==='total' ? 'total' : parseInt(el.getAttribute('data-v'),10); renderLb(); break;
    case 'lbretry': loadLb(); break;
    case 'lbremove':
      lbFetch('/delete', {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({pid:S.pid})})
        .then(function(){ S.lbOn = false; save(); toast(t('lb_removed')); renderJoin(); loadLb(); })
        .catch(function(){ toast(t('lb_error')); });
      break;
    case 'install': doInstall(); break;
  }
}
function onChange(ev){
  var id = ev.target && ev.target.id;
  if(id==='speed'){ S.speed = ev.target.value; app.style.setProperty('--dur', DUR[S.speed]); }
  if(id==='langsel'){ setLang(ev.target.value); rerender(); }
  if(id==='lbon'){ S.lbOn = !!ev.target.checked; save(); renderJoin(); if(S.lbOn) lbSubmit().then(function(){ if(S.screen==='lb') loadLb(); }); }
  if(id==='pname' && S.lbOn && S.screen==='lb') lbSubmit().then(function(){ if(S.screen==='lb') loadLb(); });
}
function onInput(ev){
  if(ev.target && ev.target.id==='pname'){ S.name = ev.target.value.slice(0,16); save(); }
}

function init(){
  app = document.getElementById('app');
  if(!app) return;
  load();
  if(!S.pid){ S.pid = newPid(); save(); }
  if(!S.lang) S.lang = detectLang();
  applyLang(); applyLook();
  if(window.matchMedia){
    try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ applyLook(); }); }catch(e){}
  }
  if(TTS){ try{ speechSynthesis.getVoices(); }catch(e){} }
  app.addEventListener('click', onClick);
  app.addEventListener('change', onChange);
  app.addEventListener('input', onInput);
  if(HOSTED){
    window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); INST.evt = e; });
    window.addEventListener('appinstalled', function(){ INST.evt = null; toast(t('inst_done')); });
    if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
      window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
    }
  }
  if(S.lbPending) lbSubmit();
  renderTitle();
}
if(typeof window!=='undefined'){ window.__wick = {CHAPTERS:CHAPTERS, simulate:simulate, Fail:Fail, ORDER:ORDER}; }
init();
})();
</script>
